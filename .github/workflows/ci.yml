name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockseer
          POSTGRES_PASSWORD: stockseer
          POSTGRES_DB: stockseer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockseer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI has no reason to depend on Yahoo being up, or to hammer it.
      DATA_SOURCE: synthetic
      NEWS_SOURCE: synthetic
      DATABASE_URL: postgresql+psycopg2://stockseer:stockseer@localhost:5432/stockseer_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pip install -e

      - name: Lint
        run: ruff check stockseer tests

      - name: Test
        run: pytest tests -q --cov=stockseer --cov-report=term-missing

      - name: Smoke-test the full pipeline against Postgres
        run: python -m stockseer.cli pipeline --symbols CI1,CI2,CI3 --period 3y

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
