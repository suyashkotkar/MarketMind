# Render blueprint: managed Postgres + API + static dashboard + a nightly job.
# `render blueprint launch` (or connect the repo in the dashboard) provisions all four.
databases:
  - name: stockseer-db
    databaseName: stockseer
    user: stockseer
    plan: basic-256mb

services:
  - type: web
    name: stockseer-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: starter
    healthCheckPath: /api/v1/health
    disk:
      name: artifacts
      mountPath: /data/artifacts
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: stockseer-db, property: connectionString }
      - key: ENV
        value: production
      - key: DATA_SOURCE
        value: yahoo
      - key: NEWS_SOURCE
        value: auto
      - key: ARTIFACTS_DIR
        value: /data/artifacts
      - key: CORS_ORIGINS
        sync: false        # set to the dashboard's URL after the first deploy
      - key: NEWSAPI_KEY
        sync: false
      - key: FINNHUB_KEY
        sync: false

  - type: web
    name: stockseer-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        sync: false        # https://stockseer-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: stockseer-refresh
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    schedule: "30 22 * * 1-5"
    dockerCommand: python -m stockseer.cli ingest --period 6mo
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: stockseer-db, property: connectionString }
      - key: DATA_SOURCE
        value: yahoo
      - key: ARTIFACTS_DIR
        value: /data/artifacts
