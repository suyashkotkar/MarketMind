[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockseer"
version = "0.1.0"
description = "Data-driven stock direction probabilities, risk scoring and anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["stockseer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]   # E501: long comment lines; B008: FastAPI Depends() default

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"stockseer/api/cache.py" = ["A001"]

[tool.coverage.run]
source = ["stockseer"]
omit = ["stockseer/cli.py"]
